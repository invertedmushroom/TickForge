[package]
name = "simulation_worker"
version.workspace = true
edition.workspace = true

[features]
# Enable the "connected" feature to build the coordinator.
# Requires module bindings generated by:
#   spacetime generate --lang rust --out-dir crates/simulation_worker/src/module_bindings --project-path crates/server_module
connected = ["dep:spacetimedb-sdk", "dep:serde_json"]

[dependencies]
game_protocol = { workspace = true }
game_core = { workspace = true }
rapier3d = { workspace = true }
nalgebra = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
spacetimedb-sdk = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
