[package]
name = "game_client_bevy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tickforge_client"
path = "src/main.rs"

[features]
default = ["connected"]
connected = ["game_client/connected", "dep:spacetimedb-sdk"]

[dependencies]
game_client = { path = "../game_client" }
game_core = { workspace = true }
game_schema = { workspace = true }
ron = { workspace = true }
spacetimedb-sdk = { workspace = true, optional = true }
bevy = { version = "0.15", features = ["jpeg"] }
log = { workspace = true }
env_logger = { workspace = true }
crossbeam-channel = "0.5"
