[package]
name = "game_client"
version.workspace = true
edition.workspace = true

[features]
# Enable "connected" to build the real SDK client.
# Requires module bindings generated by:
#   spacetime generate --lang rust --out-dir crates/game_client/src/module_bindings --module-path crates/server_module
connected = ["dep:spacetimedb-sdk"]

[dependencies]
log = { workspace = true }
env_logger = { workspace = true }
spacetimedb-sdk = { workspace = true, optional = true }
